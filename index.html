<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function() {
        var s = localStorage.getItem('aiborne_theme_preference');
        var l = s === 'light' || (s !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (l) document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Borne — Engineering Intelligent Apps & Automation</title>
    <meta name="description" content="Official developer studio website for AI-Borne. Engineering privacy-first apps, AI deployments, and Kotlin Multiplatform software." />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ts/main.ts"></script>
  </body>
</html>
