name: AI-Borne Daily Engineering Insight Engine

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-publish:
    name: Generate & Publish Daily Engineering Playbook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Execute Autonomous Daily Insight Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx --no-install tsx scripts/generate-daily-insight.ts

      - name: Install Playwright Browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Complete Quality Gate
        run: npm run quality

      - name: Validate Generated Changes
        run: git diff --check

      - name: Commit and Open Daily Playbook Pull Request
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI-Borne Publishing Engine"
          if [ -n "$(git status --porcelain)" ]; then
            TODAY=$(date +'%Y-%m-%d')
            BRANCH="automation/daily-playbook-${TODAY}"
            git switch -c "${BRANCH}"
            git add content/blog/ public/sitemap.xml public/llms.txt
            git commit -m "feat(insights): publish daily engineering playbook [${TODAY}]"
            git push origin "${BRANCH}"
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "feat(insights): publish daily engineering playbook [${TODAY}]" \
              --body "Automated daily insight. The workflow completed npm run quality before opening this pull request."
          else
            echo "No new playbook generated; repository is up-to-date."
          fi
