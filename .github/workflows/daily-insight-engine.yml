name: AI-Borne Daily Engineering Insight Engine

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  generate-and-publish:
    name: Generate & Publish Daily Engineering Playbook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Execute Autonomous Daily Insight Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx --no-install tsx scripts/generate-daily-insight.ts

      - name: Install Playwright Browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Complete Quality Gate
        run: npm run quality

      - name: Validate Generated Changes
        run: git diff --check

      - name: Commit and Open Daily Playbook Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI-Borne Publishing Engine"
          if [ -n "$(git status --porcelain)" ]; then
            TODAY=$(date +'%Y-%m-%d')
            BRANCH="automation/daily-playbook-${TODAY}"
            git switch -c "${BRANCH}"
            git add content/blog/ public/sitemap.xml public/llms.txt
            git commit -m "feat(insights): publish daily engineering playbook [${TODAY}]"
            git push origin "${BRANCH}"
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "feat(insights): publish daily engineering playbook [${TODAY}]" \
              --body "Automated daily insight. The workflow completed npm run quality before opening this pull request."

            # Run the required gate on the PR head, merge only if it passes, then deploy main.
            gh workflow run ci.yml --ref "${BRANCH}"
            RUN_ID=""
            for _ in $(seq 1 30); do
              RUN_ID=$(gh run list --workflow ci.yml --branch "${BRANCH}" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "${RUN_ID}" ] && break
              sleep 5
            done
            [ -n "${RUN_ID}" ] || { echo "CI run did not start"; exit 1; }
            gh run watch "${RUN_ID}" --exit-status
            gh pr merge "${BRANCH}" --squash --delete-branch
            gh workflow run ci.yml --ref main
          else
            echo "No new playbook generated; repository is up-to-date."
          fi
