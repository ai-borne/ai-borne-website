name: AI-Borne CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets the daily publisher run the gate on its own branch and deploy after merge:
  # events from GITHUB_TOKEN never start push/pull_request runs, but dispatch is allowed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Build & Test Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Complete Quality Gate
        run: npm run quality

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: dist-bundle
          path: dist/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: validate-and-build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Download Build Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist-bundle
          path: dist/

      - name: Verify Downloaded Production Artifact
        run: npm run test:production

      - name: Deploy to Cloudflare Pages
        run: npx --no-install wrangler pages deploy dist --project-name=ai-borne
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
