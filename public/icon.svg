      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0038B8" />
    </linearGradient>
  </defs>
  <!-- Full background for OS maskable squircle/rounded rectangle clipping -->
  <rect width="100" height="100" fill="#0B1340" />
